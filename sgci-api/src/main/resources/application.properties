# CONFIGURACOES DO SPRING E SERVIDOR:

spring.application.name=GerenciadorCadastrosImobiliarios
spring.profiles.active=dev
server.port=8081
server.servlet.context-path=/v1/api

# CONFIGURACOES DE BANCO DE DADOS:

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:banco-sgci}
spring.datasource.username=${DB_USERNAME:joao}
spring.datasource.password=${DB_PASSWORD:adm123}

# CONFIGURACOES HIBERNATE:

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURACOES SWAGGER:

springdoc.swagger-ui.path=/swagger-ui.html

