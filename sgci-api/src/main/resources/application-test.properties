# Application properties para os testes unitario com Junit:

# O "tc:" diz para subir a imagem do mysql 8.0 no Docker
spring.datasource.url=jdbc:tc:mysql:8.0:///banco_teste
spring.datasource.initialization-mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update